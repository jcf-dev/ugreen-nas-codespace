name: Bug report
description: Report a reproducible problem in this project
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, keys, or an unredacted `.env`.
  - type: input
    id: model
    attributes:
      label: UGREEN model and architecture
      placeholder: DXP4800 Plus, x86_64
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: UGOS, Docker, Compose, and image versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed all secrets and personally identifying data.
          required: true
