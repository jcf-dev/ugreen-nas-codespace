name: Container CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        env:
          IMAGE_NAME: local/ugreen-nas-codespace:ci
          PASSWORD: ci-only-password-not-for-deployment
        run: docker compose -f docker-compose.yml -f compose/build.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: local/ugreen-nas-codespace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
