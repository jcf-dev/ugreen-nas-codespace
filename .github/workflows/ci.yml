name: Container CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          HASHED_PASSWORD: '$argon2id$v=19$m=65536,t=3,p=1$Y2ktb25seS1ub3Qtc2VjcmV0$Y2ktb25seS1ub3Qtc2VjcmV0'
          IMAGE_NAME: local/ugreen-nas-codespace:ci
          WORKSPACE_PATH: /tmp/ugreen-ci-workspace
        run: |
          docker compose -f docker-compose.yml -f compose/build.yml config --quiet
          docker compose -f examples/ugos/docker-compose.yml config --quiet

      - name: Validate scripts and onboarding extension
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          scripts/test-onboarding.sh
          node --check extensions/ugreen-onboarding/extension.js
          node -e 'JSON.parse(require("fs").readFileSync("extensions/ugreen-onboarding/package.json"))'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build full amd64 image
        uses: docker/build-push-action@v7
        with:
          build-args: IMAGE_VARIANT=full
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: local/ugreen-nas-codespace:ci-full
          cache-from: |
            type=gha,scope=full
            type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=full

      - name: Test authentication, tools, workspace, and SSH
        shell: bash
        run: |
          set -euo pipefail

          if docker run --rm \
            -e PASSWORD=plaintext-is-forbidden \
            local/ugreen-nas-codespace:ci-full; then
            echo "Plaintext PASSWORD was incorrectly accepted" >&2
            exit 1
          fi

          hash_line="$(printf '%s' 'ci-only-password-not-for-deployment' | \
            docker run --rm -i \
              --entrypoint /usr/local/bin/generate-hashed-password \
              local/ugreen-nas-codespace:ci-full --stdin)"
          compose_hash="${hash_line#HASHED_PASSWORD=}"
          raw_hash="${compose_hash//\$\$/\$}"

          ssh-keygen -q -t ed25519 -N '' -f "${RUNNER_TEMP}/codespace_ci_key"
          public_key="$(cat "${RUNNER_TEMP}/codespace_ci_key.pub")"

          docker run --detach --name codespace-ci \
            -e "HASHED_PASSWORD=${raw_hash}" \
            -e "SSH_AUTHORIZED_KEY=${public_key}" \
            -p 127.0.0.1::2222 \
            local/ugreen-nas-codespace:ci-full
          trap 'docker rm --force codespace-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if docker exec codespace-ci curl --fail --silent \
              http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              docker logs codespace-ci
              exit 1
            fi
            sleep 2
          done

          login_status="$(docker exec codespace-ci curl --silent \
            --output /dev/null --write-out '%{http_code}' \
            --data-urlencode 'password=ci-only-password-not-for-deployment' \
            http://127.0.0.1:8080/login)"
          test "${login_status}" = "302"

          docker exec codespace-ci bash -lc '
            set -e
            test -w /workspace
            touch /workspace/.write-test
            ! grep -Eq "^[[:space:]]*password[[:space:]]*:" \
              "$HOME/.config/code-server/config.yaml"
            code-server --version
            nvm --version
            node --version
            npm --version
            pnpm --version
            yarn --version
            tsc --version
            python3 --version
            pipx --version
            uv --version
            git --version
            gh --version
            test -x /usr/local/bin/ugreen-onboard
            test "$(ugreen-onboard status)" = pending
            test -f /usr/lib/code-server/lib/vscode/extensions/ugreen-codespace-onboarding/extension.js
            docker --version
            docker buildx version
            docker compose version
            claude --version
            codex --version
            opencode --version
          '

          ssh_port="$(docker port codespace-ci 2222/tcp | sed 's/.*://')"
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i "${RUNNER_TEMP}/codespace_ci_key" \
            -p "${ssh_port}" \
            coder@127.0.0.1 \
            'test -w /workspace && node --version && python3 --version'

      - name: Scan full image for fixable critical and high vulnerabilities
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: local://local/ugreen-nas-codespace:ci-full
          only-fixed: true
          only-severities: critical,high
          vex-location: .vex
          sarif-file: scout-full.sarif
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          write-comment: false

      - name: Enforce full-image vulnerability policy
        env:
          ACCEPTED_VEX_CVE: CVE-2026-34040
        run: |
          jq --exit-status --arg accepted "$ACCEPTED_VEX_CVE" '
            [.runs[].results[] | select(.ruleId != $accepted)] | length == 0
          ' scout-full.sarif

      - name: Build slim amd64 image
        uses: docker/build-push-action@v7
        with:
          build-args: IMAGE_VARIANT=slim
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: local/ugreen-nas-codespace:ci-slim
          cache-from: |
            type=gha,scope=slim
            type=gha,scope=full
          cache-to: type=gha,mode=max,scope=slim

      - name: Verify slim image contents
        run: |
          docker run --rm --entrypoint /bin/bash \
            local/ugreen-nas-codespace:ci-slim -lc '
              set -e
              code-server --version
              nvm --version
              node --version
              npm --version
              pnpm --version
              yarn --version
              tsc --version
              python3 --version
              pipx --version
              git --version
              gh --version
              /home/coder/entrypoint.d/10-init-workspace.sh
              test -x /usr/local/bin/ugreen-onboard
              test "$(ugreen-onboard status)" = pending
              test -f /usr/lib/code-server/lib/vscode/extensions/ugreen-codespace-onboarding/extension.js
              test ! -x "${NVM_DIR}/current/bin/claude"
              test ! -x "${NVM_DIR}/current/bin/codex"
              test ! -x "${NVM_DIR}/current/bin/opencode"
              test -x /usr/local/bin/claude
              test -x /usr/local/bin/install-ai-tools
              test ! -x /usr/bin/docker

              claude --version
              codex --version
              opencode --version
              test -x "$HOME/.local/bin/claude"
              test -x "$HOME/.local/bin/codex"
              test -x "$HOME/.local/bin/opencode"
            '

      - name: Scan slim image for fixable critical and high vulnerabilities
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: cves
          image: local://local/ugreen-nas-codespace:ci-slim
          only-fixed: true
          only-severities: critical,high
          exit-code: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          write-comment: false
