name: Publish container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional SemVer tag to publish, such as v1.2.3
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: SemVer tag created by the release workflow
        required: false
        type: string

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check publishing configuration
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub publishing skipped: configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
          fi

  publish:
    needs: credentials
    if: needs.credentials.outputs.configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
            floating_tag: latest
          - variant: slim
            suffix: -slim
            floating_tag: slim
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ugreen-nas-codespace
          tags: |
            type=raw,value=${{ matrix.floating_tag }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}}${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.suffix }}
            type=semver,pattern={{major}}${{ matrix.suffix }}
            type=raw,value=${{ inputs.version }}${{ matrix.suffix }},enable=${{ inputs.version != '' }}
            type=semver,value=${{ inputs.version }},pattern={{version}}${{ matrix.suffix }},enable=${{ inputs.version != '' }}
            type=semver,value=${{ inputs.version }},pattern={{major}}.{{minor}}${{ matrix.suffix }},enable=${{ inputs.version != '' }}
            type=semver,value=${{ inputs.version }},pattern={{major}}${{ matrix.suffix }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-,suffix=${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=UGREEN NAS Codespace
            org.opencontainers.image.variant=${{ matrix.variant }}

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          build-args: IMAGE_VARIANT=${{ matrix.variant }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Attach Docker Scout VEX assessment
        if: matrix.variant == 'full'
        uses: docker/scout-action@bacf462e8d090c09660de30a6ccc718035f961e3 # v1
        with:
          command: attestation-add
          image: ${{ secrets.DOCKERHUB_USERNAME }}/ugreen-nas-codespace@${{ steps.push.outputs.digest }}
          file: .vex/CVE-2026-34040.vex.json
          predicate-type: https://openvex.dev/ns/v0.2.0
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry-write-user: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-write-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ugreen-nas-codespace
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
