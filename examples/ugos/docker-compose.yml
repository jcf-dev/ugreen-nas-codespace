# Paste-ready example for UGOS Pro's Docker > Project interface.
# Before deploying, replace the password hash and SSH key, then verify the UID,
# GID, time zone, ports, and host workspace path. See docs/UGOS_SETUP.md.

name: ugreen-nas-codespace

services:
  codespace:
    image: joweenflores/ugreen-nas-codespace:latest
    container_name: ugreen-codespace
    hostname: codespace
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOCKER_USER: coder
      ENABLE_SSH: "true"
      HASHED_PASSWORD: "$$argon2id$$REPLACE-WITH-SCRIPT-OUTPUT"
      SSH_AUTHORIZED_KEY: "ssh-ed25519 REPLACE-WITH-YOUR-PUBLIC-KEY"
      TZ: Etc/UTC
    ports:
      - "8443:8080"
      - "2222:2222"
    volumes:
      # Replace this example with the absolute path shown by UGOS File Manager.
      - type: bind
        source: /volume1/docker/ugreen-nas-codespace/workspace
        target: /workspace
        bind:
          create_host_path: false
      - codespace-config:/home/coder/.config
      - codespace-local:/home/coder/.local
      - codespace-claude:/home/coder/.claude
      - codespace-codex:/home/coder/.codex
      - codespace-ssh:/home/coder/.ssh
      - codespace-gnupg:/home/coder/.gnupg
    stop_grace_period: 30s

volumes:
  codespace-config:
  codespace-local:
  codespace-claude:
  codespace-codex:
  codespace-ssh:
  codespace-gnupg:
