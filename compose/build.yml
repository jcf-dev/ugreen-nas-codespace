# Adds a local source build to the deployment-oriented base Compose file.
services:
  codespace:
    build:
      # Compose resolves override paths from the first file (repository root).
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_VARIANT: ${IMAGE_VARIANT:-full}
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.132.0}
        UV_VERSION: ${UV_VERSION:-0.12.5}
        GO_VERSION: ${GO_VERSION:-1.26.6}
        NVM_VERSION: ${NVM_VERSION:-v0.40.6}
        NODE_VERSION: ${NODE_VERSION:-24}
        NPM_VERSION: ${NPM_VERSION:-12.0.2}
        TYPESCRIPT_VERSION: ${TYPESCRIPT_VERSION:-6.0.3}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CODEX_VERSION: ${CODEX_VERSION:-latest}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-latest}
