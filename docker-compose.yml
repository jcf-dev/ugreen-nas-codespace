name: ugreen-nas-codespace

services:
  codespace:
    image: ${IMAGE_NAME:?Set IMAGE_NAME in .env to your Docker Hub image}
    container_name: ${CONTAINER_NAME:-ugreen-codespace}
    hostname: ${CONTAINER_HOSTNAME:-codespace}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DOCKER_USER: ${DOCKER_USER:-coder}
      ENABLE_SSH: ${ENABLE_SSH:-true}
      HASHED_PASSWORD: ${HASHED_PASSWORD:?Run scripts/generate-hashed-password.sh and set HASHED_PASSWORD}
      SSH_AUTHORIZED_KEY: ${SSH_AUTHORIZED_KEY:-}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8443}:8080"
      - "${SSH_BIND_ADDRESS:-0.0.0.0}:${SSH_PORT:-2222}:2222"
    volumes:
      - type: bind
        source: ${WORKSPACE_PATH:?Set WORKSPACE_PATH to an existing writable NAS directory}
        target: /workspace
        bind:
          create_host_path: false
      - codespace-config:/home/coder/.config
      - codespace-local:/home/coder/.local
      - codespace-claude:/home/coder/.claude
      - codespace-codex:/home/coder/.codex
      - codespace-ssh:/home/coder/.ssh
      - codespace-gnupg:/home/coder/.gnupg
    stop_grace_period: 30s

volumes:
  codespace-config:
  codespace-local:
  codespace-claude:
  codespace-codex:
  codespace-ssh:
  codespace-gnupg:
